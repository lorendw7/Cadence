<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cadence">
  <title>Cadence</title>
  <!-- Enji (臙脂) field — the brand seed colour, DESIGN.md -->
  <rect width="512" height="512" rx="112" fill="#8A2432"/>
  <!-- The mark: a "C" ring (the beat that keeps going) + the next beat, detached -->
  <g fill="none" stroke="#FDFAF9" stroke-width="52" stroke-linecap="round">
    <circle cx="256" cy="256" r="136"
            pathLength="100" stroke-dasharray="75 25"
            transform="rotate(45 256 256)"/>
  </g>
  <circle cx="392" cy="256" r="30" fill="#FDFAF9"/>
</svg>
